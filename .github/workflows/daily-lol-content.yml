name: Daily LoL Content

on:
  schedule:
    - cron: "0 12 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "글과 PR을 만들지 않고 검색 및 검증만 수행"
        required: false
        default: false
        type: boolean
      use_ai:
        description: "AI를 사용해 한국어·일본어 문장을 생성"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-lol-content
  cancel-in-progress: false

jobs:
  daily-content:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Ruby 및 Jekyll 설정
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Jekyll 설치
        run: gem install jekyll

      - name: Git 작성자 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 일일 LoL 정보 수집 및 후보 생성
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          WEB_SEARCH_API_KEY: ${{ secrets.WEB_SEARCH_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          npm run sync:lol
          ARGS=""
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event_name != 'workflow_dispatch' || inputs.use_ai }}" = "true" ]; then
            ARGS="$ARGS --use-ai"
          else
            ARGS="$ARGS --no-ai"
          fi
          npm run daily:lol -- $ARGS
          npm run fix:champions
          npm run generate:blog-images
          npm run validate:blog
          npm run build

      - name: 생성 결과 확인
        id: generation
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          import json
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = dt.datetime.now(ZoneInfo("Asia/Tokyo")).date().isoformat()
          path = Path(f"data/lol/intel/daily/{today}-generation-report.json")
          data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          print(f"generated={'true' if data.get('generated') else 'false'}")
          print(f"post={data.get('post', '')}")
          print(f"date={today}")
          PY

      - name: 변경사항 확인
        id: changes
        run: |
          if [ -n "$(git status --short)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: PR 브랜치 push
        if: steps.changes.outputs.has_changes == 'true' && steps.generation.outputs.generated == 'true'
        run: |
          BRANCH="automation/lol-daily-${{ steps.generation.outputs.date }}"
          git checkout -B "$BRANCH"
          git add AGENTS.md README.md docs prompts .github/workflows package.json scripts data/lol _posts assets/images reports
          git commit -m "blog: add LoL daily content ${{ steps.generation.outputs.date }}"
          git push --force-with-lease origin "$BRANCH"

      - name: Pull Request 생성 또는 갱신
        if: steps.changes.outputs.has_changes == 'true' && steps.generation.outputs.generated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="automation/lol-daily-${{ steps.generation.outputs.date }}"
          TITLE="blog: ${{ steps.generation.outputs.date }} LoL 일일 콘텐츠"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          BODY="## 생성 결과

          - 실행일: ${{ steps.generation.outputs.date }}
          - 생성 또는 갱신된 글: ${{ steps.generation.outputs.post }}

          ## 검증

          - npm run sync:lol
          - npm run fix:champions
          - npm run generate:blog-images
          - npm run validate:blog
          - npm run build

          ## 운영 원칙

          의미 있는 새 정보가 없거나 품질 기준을 통과하지 못하면 PR을 만들지 않습니다."
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$TITLE" --body "$BODY"
          else
            gh pr create --title "$TITLE" --base main --head "$BRANCH" --body "$BODY"
          fi

      - name: 새 글 없음
        if: steps.generation.outputs.generated != 'true'
        run: echo "품질 기준을 통과한 새 글이 없어 PR을 만들지 않습니다."

