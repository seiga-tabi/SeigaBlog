name: Daily LoL Intelligence Blog

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "글과 PR을 만들지 않고 검색 및 검증만 수행"
        required: false
        default: false
        type: boolean

      force_generate:
        description: "품질 기준을 충족한 주제가 있을 때 강제로 글 생성"
        required: false
        default: false
        type: boolean

      use_ai:
        description: "AI를 사용해 한국어·일본어 문장을 생성"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lol-daily-intel
  cancel-in-progress: false

jobs:
  daily-intel:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Ruby 및 Jekyll 설정
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Python 의존성 설치
        run: python3 -m pip install --upgrade pip

      - name: Jekyll 설치
        run: gem install jekyll

      - name: Git 작성자 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Riot Data Dragon locale 동기화
        run: npm run sync:lol

      - name: 최근 LoL 정보 수집
        env:
          WEB_SEARCH_API_KEY: ${{ secrets.WEB_SEARCH_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: npm run collect:lol-intel

      - name: 원문 정규화
        run: npm run normalize:lol-intel

      - name: 주장 단위 분리 및 정보 상태 분류
        run: npm run classify:lol-intel

      - name: 기존 claim 재검증
        run: npm run revalidate:lol-intel

      - name: 오늘 작성할 주제 선정
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.force_generate || false }}" = "true" ]; then
            npm run select:lol-topic -- --force-generate
          else
            npm run select:lol-topic
          fi

      - name: 글 생성 또는 검색 리포트만 생성
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          ARGS=""
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event_name != 'workflow_dispatch' || inputs.use_ai }}" = "true" ]; then
            ARGS="$ARGS --use-ai"
          else
            ARGS="$ARGS --no-ai"
          fi
          npm run generate:lol-daily -- $ARGS

      - name: 챔피언명 locale 보정
        run: npm run fix:champions

      - name: 블로그 이미지 생성
        run: npm run generate:blog-images

      - name: 콘텐츠 검증
        run: npm run validate:blog

      - name: Jekyll build
        run: npm run build

      - name: 생성 결과 확인
        id: generation
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          import json
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = dt.datetime.now(ZoneInfo("Asia/Tokyo")).date().isoformat()
          path = Path(f"data/lol/intel/daily/{today}-generation-report.json")
          data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          print(f"generated={'true' if data.get('generated') else 'false'}")
          print(f"post={data.get('post', '')}")
          print(f"reason={data.get('reason', '')}")
          print(f"date={today}")
          PY

      - name: 변경사항 확인
        id: changes
        run: |
          if [ -n "$(git status --short)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 자동화 브랜치 생성
        if: steps.changes.outputs.has_changes == 'true' && steps.generation.outputs.generated == 'true'
        run: |
          BRANCH="automation/lol-daily-${{ steps.generation.outputs.date }}"
          git checkout -B "$BRANCH"
          git add AGENTS.md README.md docs prompts .github/workflows package.json scripts data/lol _posts assets/images reports
          git commit -m "blog: add LoL daily intel ${{ steps.generation.outputs.date }}"
          git push --force-with-lease origin "$BRANCH"

      - name: Pull Request 생성 또는 갱신
        if: steps.changes.outputs.has_changes == 'true' && steps.generation.outputs.generated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="automation/lol-daily-${{ steps.generation.outputs.date }}"
          TITLE="blog: ${{ steps.generation.outputs.date }} LoL 일일 정보 글"
          REPORT="reports/lol-intel/${{ steps.generation.outputs.date }}-daily-report.md"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')

          BODY=$(cat <<EOF
          ## 생성 결과

          - 실행 시각: ${{ steps.generation.outputs.date }}
          - 콘텐츠 유형: LoL 일일 정보
          - 정보 상태: 리포트 확인
          - 최종 주제: 리포트 확인
          - 주제 점수: 리포트 확인
          - 생성 또는 갱신된 글: ${{ steps.generation.outputs.post }}
          - 생성된 이미지: assets/images/blog/generated/
          - 대표 출처: 리포트 확인
          - 보조 출처: 리포트 확인

          ## 검색 결과

          - 확인한 출처: $REPORT
          - 발견한 새 항목: $REPORT
          - 중복 제외: $REPORT
          - 재검증한 기존 claim: $REPORT

          ## 검증 결과

          - Data Dragon 동기화: PASS
          - 챔피언명 검증: PASS
          - 콘텐츠 검증: PASS
          - 이미지 검증: PASS
          - Jekyll build: PASS

          ## 사람 검수 항목

          - [ ] 제목의 정보 상태가 정확한가?
          - [ ] 공식 사실과 해석이 분리되어 있는가?
          - [ ] 원문에 없는 내용이 추가되지 않았는가?
          - [ ] 한국어 문장이 자연스러운가?
          - [ ] 일본어 문장이 자연스러운가?
          - [ ] 이미지와 본문 내용이 일치하는가?
          - [ ] 미확정 정보를 확정처럼 표현하지 않았는가?
          - [ ] 출처와 마지막 확인 시각이 정확한가?
          EOF
          )

          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$TITLE" --body "$BODY"
            echo "기존 PR #$EXISTING_PR 를 업데이트했습니다."
          else
            gh pr create --title "$TITLE" --base main --head "$BRANCH" --body "$BODY"
          fi

      - name: 리포트만 생성된 경우 안내
        if: steps.changes.outputs.has_changes == 'true' && steps.generation.outputs.generated != 'true'
        run: echo "새 글이 생성되지 않아 PR을 만들지 않습니다."
