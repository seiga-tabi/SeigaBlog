name: LoL 패치 블로그 글 생성

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lol-patch-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: git 작성자 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 최신 LoL 패치 글 생성
        run: |
          python3 scripts/sync_lol_ddragon.py
          LOL_PATCH_SKIP_GIT=1 python3 scripts/generate_lol_patch_post.py
          python3 scripts/fix_champion_locales.py
          python3 scripts/generate_blog_images.py
          python3 scripts/validate_blog_content.py
          if [ -n "$(git status --short)" ]; then
            git add _posts assets/images data/lol reports scripts package.json
            git commit -m "blog: add latest LoL patch summary"
            git push
          fi
