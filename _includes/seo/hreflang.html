{% assign current_lang = page.lang | default: site.lang | default: "ko" %}
{% if page.alternates %}
  {% for alternate in page.alternates %}
    <link rel="alternate" hreflang="{{ alternate.lang }}" href="{{ alternate.url | absolute_url }}" />
  {% endfor %}
{% else %}
  <link rel="alternate" hreflang="{{ current_lang }}" href="{{ page.url | absolute_url }}" />
  <link rel="alternate" hreflang="x-default" href="{{ page.url | absolute_url }}" />
{% endif %}
