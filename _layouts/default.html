<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'ko' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% include seo/meta.html %}
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="icon" href="{{ site.profile_image | relative_url }}" />
    <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
    {% include ads/ad-script.html %}
    {% include seo/structured-data.html %}
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}">
          <span class="brand-mark">
            <img src="{{ site.profile_image | relative_url }}" alt="{{ site.title }} 프로필" />
          </span>
          <span>{{ site.title }}</span>
        </a>
        <nav
          class="header-actions"
          aria-label="{{ site.data.ui.ko.language_label }}"
          data-ko="{{ site.data.ui.ko.language_label }}"
          data-ja="{{ site.data.ui.ja.language_label }}"
        >
          <button class="lang-button is-active" type="button" data-lang="ko">KO</button>
          <button class="lang-button" type="button" data-lang="ja">JA</button>
        </nav>
      </header>

      {{ content }}

      <footer class="site-footer">
        <nav class="footer-links" aria-label="사이트 정책">
          <a href="{{ '/about/' | relative_url }}" data-ko="소개" data-ja="概要">소개</a>
          <a href="{{ '/contact/' | relative_url }}" data-ko="연락" data-ja="連絡">연락</a>
          <a href="{{ '/privacy/' | relative_url }}" data-ko="개인정보" data-ja="プライバシー">개인정보</a>
          <a href="{{ '/editorial-policy/' | relative_url }}" data-ko="편집 원칙" data-ja="編集方針">편집 원칙</a>
          <a href="{{ '/automation-disclosure/' | relative_url }}" data-ko="자동화 고지" data-ja="自動化開示">자동화 고지</a>
          <a href="{{ '/riot-disclaimer/' | relative_url }}" data-ko="Riot 고지" data-ja="Riot表記">Riot 고지</a>
        </nav>
        <p
          class="riot-footer-notice"
          data-ko="SeigaBlog는 Riot Games가 보증하거나 후원하지 않는 비공식 팬/정보 프로젝트입니다."
          data-ja="SeigaBlogはRiot Gamesが保証またはスポンサーするものではない非公式のファン/情報プロジェクトです。"
        >
          SeigaBlog는 Riot Games가 보증하거나 후원하지 않는 비공식 팬/정보 프로젝트입니다.
        </p>
      </footer>
    </div>
  </body>
</html>
