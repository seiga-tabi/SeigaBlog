<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'ko' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% include seo/meta.html %}
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="icon" href="{{ site.profile_image | relative_url }}" />
    <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
    {% include ads/ad-script.html %}
    {% include seo/structured-data.html %}
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}">
          <span class="brand-mark">
            <img src="{{ site.profile_image | relative_url }}" alt="{{ site.title }} 프로필" />
          </span>
          <span>{{ site.title }}</span>
        </a>
        <nav
          class="header-actions"
          aria-label="{{ site.data.ui.ko.language_label }}"
          data-ko="{{ site.data.ui.ko.language_label }}"
          data-ja="{{ site.data.ui.ja.language_label }}"
        >
          <button class="lang-button is-active" type="button" data-lang="ko">KO</button>
          <button class="lang-button" type="button" data-lang="ja">JA</button>
        </nav>
      </header>

      {{ content }}

    </div>
  </body>
</html>
