<text x="148" y="523" font-size="22" font-weight="800" fill="#1F2937">https://www.leagueoflegends.com/ko-kr/news/game-updates/league</text>
<text x="148" y="554" font-size="22" font-weight="800" fill="#1F2937">-of-legends-patch-26-12-notes</text>
