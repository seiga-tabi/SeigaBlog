<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img">
  <title>LoL 26.12 공식 출처 안내</title>
  <rect width="1200" height="720" fill="#ECFDF5"/>
  <rect x="40" y="40" width="1120" height="640" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="74" y="104" font-size="42" font-weight="900" fill="#0F172A">LoL 26.12 공식 출처 안내</text>
  <text x="74" y="138" font-size="23" font-weight="800" fill="#047857">LoL 26.12 公式ソース案内</text>

            <g>
              <rect x="74" y="180" width="1052" height="58" rx="10" fill="#FFFFFF" stroke="#D7E0EA"/>
              <circle cx="112" cy="209" r="16" fill="#047857"/>
              <text x="112" y="216" text-anchor="middle" font-size="18" font-weight="900" fill="#FFFFFF">1</text>
              <text x="148" y="215" font-size="22" font-weight="800" fill="#1F2937">공식패치노트를기준으로요약했습니다.</text>
            </g>
            <g>
              <rect x="74" y="268" width="1052" height="58" rx="10" fill="#FFFFFF" stroke="#D7E0EA"/>
              <circle cx="112" cy="297" r="16" fill="#047857"/>
              <text x="112" y="304" text-anchor="middle" font-size="18" font-weight="900" fill="#FFFFFF">2</text>
              <text x="148" y="303" font-size="22" font-weight="800" fill="#1F2937">챔피언명은RiotDataDragon한국어/일본어데이터를사용했습니다.</text>
            </g>
            <g>
              <rect x="74" y="356" width="1052" height="58" rx="10" fill="#FFFFFF" stroke="#D7E0EA"/>
              <circle cx="112" cy="385" r="16" fill="#047857"/>
              <text x="112" y="392" text-anchor="middle" font-size="18" font-weight="900" fill="#FFFFFF">3</text>
              <text x="148" y="391" font-size="22" font-weight="800" fill="#1F2937">챔피언이미지는로컬저장된RiotDataDragon스플래시아트를</text>
<text x="148" y="422" font-size="22" font-weight="800" fill="#1F2937">참조합니다.</text>
            </g>
            <g>
              <rect x="74" y="444" width="1052" height="58" rx="10" fill="#FFFFFF" stroke="#D7E0EA"/>
              <circle cx="112" cy="473" r="16" fill="#047857"/>
              <text x="112" y="480" text-anchor="middle" font-size="18" font-weight="900" fill="#FFFFFF">4</text>
              <text x="148" y="479" font-size="22" font-weight="800" fill="#1F2937">공식출처:</text>
<text x="148" y="510" font-size="22" font-weight="800" fill="#1F2937">https://www.leagueoflegends.com/ko-kr/news/game-updates/league-of-legends-patch-26-12-notes</text>
            </g>
</svg>
