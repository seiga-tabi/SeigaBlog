  <text x="78" y="494" font-size="22" font-weight="700" fill="#DDE7F3">• 최근 시즌 2와 서포터 메타에 대한 후속 변경 사항을 준비했습니다. 주문력 기반 신 짜오를 하향하고 유미</text><text x="78" y="526" font-size="22" font-weight="700" fill="#DDE7F3">• 챔피언 변경은 버프 8명, 너프 6명, 기타 조정 0명입니다. 비챔피언 변경은 체계, 무작위 총력전: 아</text><text x="78" y="558" font-size="22" font-weight="700" fill="#DDE7F3">• 아트록스, 그웬, 흐웨이, 잭스, 사일러스, 신드라, 트리스타나, 유미가 상향 대상입니다. 특히 초반 라</text><text x="78" y="590" font-size="22" font-weight="700" fill="#DDE7F3">• 리 신(공격력 증가량: 3.7 ⇒ 3.4), 녹턴(피해량: 65/110/155/200/245 ⇒ 65/1</text>
