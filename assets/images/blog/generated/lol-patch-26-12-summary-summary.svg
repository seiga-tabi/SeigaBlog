  <text x="78" y="494" font-size="22" font-weight="700" fill="#DDE7F3">• 공식 패치노트를 기준으로 핵심 변경 방향, 솔랭 영향, 추천 픽을 카드와 표 중심으로 정리했습니다.</text><text x="78" y="526" font-size="22" font-weight="700" fill="#DDE7F3">• 챔피언명과 이미지는 Riot Data Dragon 공식 한국어/일본어 데이터를 기준으로 맞췄습니다.</text><text x="78" y="558" font-size="22" font-weight="700" fill="#DDE7F3">• 상세 수치와 원문 맥락은 글 하단 공식 출처 링크에서 다시 확인할 수 있습니다.</text>
